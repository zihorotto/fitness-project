spring.application.name=fitnessTrackerBackend

spring.datasource.url=jdbc:postgresql://localhost:5432/fitness_tracker_db
spring.datasource.username=root
spring.datasource.password=test1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always

# OpenAI Configuration (API key loaded from .env file via OpenAIConfig)
openai.base-url=https://api.openai.com/v1
openai.model=gpt-4.1
openai.timeout=30000

# CORS Configuration
server.servlet.context-path=/
server.port=8080
